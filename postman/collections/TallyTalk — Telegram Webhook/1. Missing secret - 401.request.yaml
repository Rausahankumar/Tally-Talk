$kind: http-request
name: 1. Missing secret -> 401
description: No X-Telegram-Bot-Api-Secret-Token header at all. Expect 401 {"error":"unauthorized"}. No reply is sent, nothing is queued.
url: "{{baseUrl}}/webhook/telegram"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "update_id": 100001,
      "message": {
        "message_id": 1,
        "date": 1700000000,
        "from": { "id": {{allowedUserId}}, "is_bot": false, "first_name": "Test", "username": "testuser" },
        "chat": { "id": {{chatId}}, "type": "private", "first_name": "Test" },
        "text": "hello"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 401', () => pm.response.to.have.status(401));
      pm.test('body is unauthorized', () => pm.expect(pm.response.json()).to.eql({ error: 'unauthorized' }));
order: 1000
