$kind: http-request
name: 2. Wrong secret -> 401
description: Header present but wrong. Expect 401 {"error":"unauthorized"} — identical response to the missing-secret case, deliberately, so a prober learns nothing.
url: "{{baseUrl}}/webhook/telegram"
method: POST
headers:
  Content-Type: application/json
  X-Telegram-Bot-Api-Secret-Token: definitely-the-wrong-secret
body:
  type: text
  content: |-
    {
      "update_id": 100002,
      "message": {
        "message_id": 2,
        "date": 1700000000,
        "from": { "id": {{allowedUserId}}, "is_bot": false, "first_name": "Test", "username": "testuser" },
        "chat": { "id": {{chatId}}, "type": "private", "first_name": "Test" },
        "text": "hello"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 401', () => pm.response.to.have.status(401));
      pm.test('body is unauthorized', () => pm.expect(pm.response.json()).to.eql({ error: 'unauthorized' }));
order: 2000
